name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      generate_keystore:
        description: 'Generate new keystore (run once)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Keystore
        if: ${{ github.event.inputs.generate_keystore == 'true' }}
        run: |
          keytool -genkey -v \
            -keystore glitchit.keystore \
            -alias glitchit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass glitchit2024 \
            -keypass glitchit2024 \
            -dname "CN=GlitchIt, OU=Development, O=GlitchIt, L=Unknown, ST=Unknown, C=US"
          echo "KEYSTORE_BASE64=$(base64 -w 0 glitchit.keystore)" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        id: keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > glitchit.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Copy Keystore
        if: steps.keystore.outputs.has_keystore == 'true'
        run: cp glitchit.keystore android/app/

      - name: Build Signed Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: app/glitchit.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: glitchit
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GlitchIt-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlitchIt-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
