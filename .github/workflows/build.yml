name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          if [ $? -ne 0 ]; then
            echo "::error::npm ci failed"
            exit 1
          fi

      - name: Verify EAS CLI is available
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Check EAS project linking
        run: |
          eas whoami
          eas project:info

      - name: Build Android APK
        run: |
          eas build --platform android --profile production --non-interactive --no-fingerprint 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::EAS build failed with exit code $BUILD_EXIT"
            exit 1
          fi
          echo "✅ Build submitted successfully"

      - name: Print build summary
        if: success()
        run: echo "### ✅ APK Build Triggered" >> $GITHUB_STEP_SUMMARY
