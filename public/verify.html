<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlitchIt — Verified!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07070d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 32px; font-weight: 800; margin-bottom: 24px; }
    .logo span { color: #7c3aed; }
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 40px;
      background: rgba(34, 197, 94, 0.15);
      border: 2px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .checkmark svg { width: 40px; height: 40px; }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 20px;
      padding: 10px 20px;
      margin-bottom: 32px;
    }
    .badge-text {
      font-size: 14px;
      font-weight: 600;
      color: #3b82f6;
    }
    .btn {
      display: inline-block;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #6d28d9; }
    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Glitch<span>It</span></div>

    <div class="checkmark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <div class="title">Account Fully Verified!</div>
    <div class="subtitle">
      Your GlitchIt verified badge is now active for 1 month.
    </div>

    <div class="badge">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span class="badge-text">GlitchIt Verified</span>
    </div>

    <a id="open-app" class="btn" href="glitchit://verify">Open GlitchIt</a>

    <p class="hint">
      Tap <strong>Open GlitchIt</strong> to see your blue tick badge.<br/>
      Verification expires in 30 days. Pay again to renew.
    </p>
  </div>

  <script>
    // Try to open the app automatically
    window.location.href = 'glitchit://verify';

    // If app isn't installed, the page stays visible as a success screen
  </script>
</body>
</html>
