<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlitchIt — Verify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07070d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #141420;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 32px; font-weight: 800; margin-bottom: 8px; }
    .logo span { color: #7c3aed; }
    .status { margin: 24px 0; font-size: 18px; font-weight: 600; }
    .status.success { color: #22c55e; }
    .status.error { color: #ef4444; }
    .status.loading { color: #888; }
    .key-box {
      background: #0d0d16;
      border: 1px solid #2a2a3a;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 14px;
      color: #7c3aed;
      word-break: break-all;
      margin: 16px 0;
      user-select: all;
    }
    .btn {
      display: inline-block;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      margin-top: 16px;
    }
    .btn:hover { background: #6d28d9; }
    .hint { color: #888; font-size: 13px; margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Glitch<span>It</span></div>
    <div id="status" class="status loading">Verifying your payment…</div>
    <div id="key-section" style="display:none;">
      <p style="color:#888; font-size:14px; margin-bottom:8px;">Your verification key:</p>
      <div id="key" class="key-box"></div>
    </div>
    <div id="action-section" style="display:none;">
      <a id="open-app" class="btn" href="#">Open GlitchIt</a>
      <p class="hint">
        Tap <strong>Open GlitchIt</strong> to activate your verified badge.<br/>
        If nothing happens, copy the key above and open it manually in the app.
      </p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const key = params.get('key');
    const statusEl = document.getElementById('status');
    const keySection = document.getElementById('key-section');
    const keyEl = document.getElementById('key');
    const actionSection = document.getElementById('action-section');
    const openBtn = document.getElementById('open-app');

    if (!key) {
      statusEl.textContent = 'No verification key found.';
      statusEl.className = 'status error';
    } else {
      // Show the key
      keyEl.textContent = key;
      keySection.style.display = 'block';

      // Deep link into the app
      const deepLink = 'glitchit://verify?key=' + key;
      openBtn.href = deepLink;

      // Auto-redirect after a short delay
      statusEl.textContent = '✅ Payment received!';
      statusEl.className = 'status success';
      actionSection.style.display = 'block';

      // Try to open the app automatically
      window.location.href = deepLink;

      // Fallback: if the app isn't installed, show the manual option
      setTimeout(function() {
        statusEl.textContent = 'Open GlitchIt to activate your badge';
        statusEl.className = 'status loading';
      }, 3000);
    }
  </script>
</body>
</html>
